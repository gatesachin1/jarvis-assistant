[project]
name = "jarvis-assistant"
version = "2.1.0"
description = "J.A.R.V.I.S - personal desktop + Android voice assistant"
requires-python = ">=3.10"

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
